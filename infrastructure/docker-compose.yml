# Local development stack: PostgreSQL, Redis, MinIO and the Spring Boot API.
#   cd infrastructure
#   copy .env.example .env   (then fill in the secrets)
#   docker compose up -d --build
#
# Datastores bind to 127.0.0.1 only. In production, put the API behind nginx with TLS (see docs/deployment.md).

name: employee-monitor

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: employee_monitor
      POSTGRES_USER: employee_monitor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infrastructure/.env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_monitor -d employee_monitor"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in infrastructure/.env}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # S3-compatible object storage for screenshots (used from Milestone 5). Never exposed publicly.
  # Opt-in: `docker compose --profile storage up -d`. MinIO no longer publishes public images on
  # Docker Hub/quay, so set MINIO_IMAGE to an image your organisation mirrors or builds.
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    profiles: ["storage"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in infrastructure/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infrastructure/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: ../backend/employee-monitor-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/employee_monitor
      DB_USERNAME: employee_monitor
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infrastructure/.env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SCREENSHOT_DIR: /data/screenshots
      SCREENSHOT_ENCRYPTION_KEY: ${SCREENSHOT_ENCRYPTION_KEY:-}
      UPDATE_DIR: /data/updates
    volumes:
      - screenshots-data:/data/screenshots
      - updates-data:/data/updates
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  screenshots-data:
  updates-data:
