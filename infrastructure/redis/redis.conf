# Redis holds realtime presence, rate-limit counters and pub/sub events.
# All of it is reconstructable, but AOF keeps presence across container restarts.
appendonly yes
appendfsync everysec
maxmemory-policy noeviction
protected-mode yes
# Disable commands that are dangerous if the password ever leaks.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
